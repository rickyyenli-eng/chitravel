<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>順路走 行程機</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;700&display=swap">
<style>
html,body{margin:0}
img{max-width:100%}
:root{
  --bg:#FAF6F1; --surface:#FFFFFF; --surface-2:#F3ECE4; --sunk:#EFE7DD;
  --ink:#1C1815; --muted:#7C6F64; --line:#E4DAD0;
  --accent:#D9531E; --accent-ink:#FFFFFF; --accent-soft:#FBEADF;
  --rail:#C3B4A5;
  --good:#2E7D57; --good-soft:#E4F1EA;
  --warn:#9E6913; --warn-soft:#F7EBD6;
  --info:#1D6FA3; --info-soft:#E4EFF7;
  --shadow:0 1px 2px rgba(28,24,21,.05), 0 8px 24px -16px rgba(28,24,21,.28);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#14110E; --surface:#1E1A16; --surface-2:#272119; --sunk:#191510;
    --ink:#F3ECE3; --muted:#A2948A; --line:#342C24;
    --accent:#F26F3C; --accent-ink:#1A1109; --accent-soft:#3A2317;
    --rail:#4C4137;
    --good:#5FBE8F; --good-soft:#16281F;
    --warn:#E2AC5A; --warn-soft:#2C2114;
    --info:#74B8E6; --info-soft:#152532;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -16px rgba(0,0,0,.8);
  }
}
:root[data-theme="dark"]{
  --bg:#14110E; --surface:#1E1A16; --surface-2:#272119; --sunk:#191510;
  --ink:#F3ECE3; --muted:#A2948A; --line:#342C24;
  --accent:#F26F3C; --accent-ink:#1A1109; --accent-soft:#3A2317;
  --rail:#4C4137;
  --good:#5FBE8F; --good-soft:#16281F;
  --warn:#E2AC5A; --warn-soft:#2C2114;
  --info:#74B8E6; --info-soft:#152532;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -16px rgba(0,0,0,.8);
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  font-size:15px; line-height:1.65; -webkit-font-smoothing:antialiased;
}
h1,h2,h3{font-family:"Noto Serif TC",Georgia,"Songti TC",serif;font-weight:700;margin:0;text-wrap:balance;line-height:1.3}
.mono{font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}

/* ---------- shell ---------- */
.wrap{max-width:1180px;margin:0 auto;padding:0 20px 132px}
.masthead{
  border-bottom:1px solid var(--line); padding:26px 0 20px; margin-bottom:26px;
  display:flex;flex-wrap:wrap;align-items:flex-end;gap:14px 20px;
}
.brand{display:flex;align-items:center;gap:12px}
.sig{
  width:38px;height:38px;border-radius:10px;background:var(--accent);color:var(--accent-ink);
  display:grid;place-items:center;font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:17px;flex:none;
}
.brand h1{font-size:23px;letter-spacing:.01em}
.brand p{margin:1px 0 0;font-size:12.5px;color:var(--muted);letter-spacing:.06em}
.masthead .spacer{flex:1}
.stampline{
  font-family:"IBM Plex Mono",monospace;font-size:11.5px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--muted);
}

.cols{display:grid;grid-template-columns:1fr;gap:26px}
@media (min-width:960px){ .cols{grid-template-columns:352px minmax(0,1fr);gap:34px;align-items:start} }

/* ---------- form panel ---------- */
.panel{
  background:var(--surface);border:1px solid var(--line);border-radius:14px;
  padding:20px;box-shadow:var(--shadow);
}
@media (min-width:960px){ .panel{position:sticky;top:18px;max-height:calc(100vh - 36px);overflow-y:auto} }
.panel h2{font-size:15px;margin-bottom:2px}
.panel-sub{font-size:12.5px;color:var(--muted);margin:0 0 16px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:15px}
.field > label, .grp > .lab{
  font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:500;
  font-family:"IBM Plex Mono",monospace;
}
input[type=text],input[type=number],input[type=date],input[type=time],textarea,select{
  width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;
  background:var(--sunk);color:var(--ink);font:inherit;font-size:14.5px;
}
input:focus,textarea:focus{outline:none;border-color:var(--accent);background:var(--surface)}
textarea{resize:vertical;min-height:60px}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grp{margin-bottom:15px}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:7px}
.chip{
  display:inline-flex;align-items:center;gap:5px;padding:5px 11px;border-radius:999px;
  border:1px solid var(--line);background:var(--surface-2);font-size:13px;color:var(--muted);
  transition:background .14s,color .14s,border-color .14s;
}
.chip:hover{border-color:var(--rail)}
.chip input{position:absolute;opacity:0;width:0;height:0}
.chip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:500}
.hintlinks{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px}
.hintlinks button{
  background:none;border:none;padding:2px 0;font-size:12.5px;color:var(--info);
  text-decoration:underline;text-underline-offset:3px;
}
.actions{display:flex;gap:9px;margin-top:18px}
.btn{
  border:1px solid var(--line);background:var(--surface-2);border-radius:9px;
  padding:11px 15px;font-size:14.5px;font-weight:500;
}
.btn:hover{border-color:var(--rail)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);flex:1}
.btn.primary:hover{filter:brightness(1.06)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.dice{flex:none;padding:11px 13px}

/* ---------- output ---------- */
.out{min-height:320px}
.empty{
  border:1px dashed var(--line);border-radius:14px;padding:46px 26px;text-align:center;color:var(--muted);
  background:var(--surface);
}
.empty h2{font-size:19px;color:var(--ink);margin-bottom:8px}
.empty p{margin:0 auto;max-width:44ch;font-size:14px}
.empty .demo{margin-top:20px}

.notice{
  display:flex;gap:10px;align-items:flex-start;padding:11px 14px;border-radius:10px;
  background:var(--warn-soft);color:var(--warn);font-size:13px;margin-bottom:18px;border:1px solid transparent;
}
.notice.demo{background:var(--info-soft);color:var(--info)}
.notice b{font-weight:700}

.trip-head{margin-bottom:20px}
.trip-head h2{font-size:26px;margin-bottom:6px}
.trip-head p{margin:0;color:var(--muted);font-size:14.5px;max-width:62ch}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.tag{
  font-family:"IBM Plex Mono",monospace;font-size:11.5px;letter-spacing:.04em;
  padding:3px 9px;border-radius:5px;background:var(--surface-2);color:var(--muted);border:1px solid var(--line);
}

.secttl{
  display:flex;align-items:center;gap:10px;margin:30px 0 14px;
  font-family:"IBM Plex Mono",monospace;font-size:11.5px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--muted);
}
.secttl::after{content:"";flex:1;height:1px;background:var(--line)}

/* timeline */
.timeline{display:flex;flex-direction:column}
.stop{display:grid;grid-template-columns:44px minmax(0,1fr);padding-bottom:14px}
.rail{position:relative}
.rail::before{content:"";position:absolute;left:20px;top:0;bottom:-14px;width:2px;background:var(--rail)}
.stop:first-child .rail::before{top:22px}
.stop:last-child .rail::before{bottom:auto;height:22px}
.dot{
  position:absolute;left:12px;top:14px;width:18px;height:18px;border-radius:50%;
  background:var(--surface);border:3px solid var(--rail);z-index:1;
}
.stop[data-kind="food"] .dot{border-color:var(--accent)}
.stop[data-kind="sight"] .dot{border-color:var(--good)}
.stop[data-kind="stay"] .dot{border-color:var(--info)}
.stop[data-kind="transit"] .dot{width:12px;height:12px;left:15px;top:18px;border-width:2px;background:var(--rail);border-color:var(--rail)}

.card{
  background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;
  box-shadow:var(--shadow);transition:opacity .18s;
}
.stop[data-kind="transit"] .card{background:var(--surface-2);box-shadow:none;padding:11px 14px}
.stop.off .card{opacity:.42}
.stop.pending .dot{border-color:var(--rail);background:var(--surface)}
.stop.pending .card{display:flex;align-items:center;gap:10px;background:var(--surface-2);box-shadow:none;color:var(--muted);font-size:13.5px}
.pulse{width:8px;height:8px;border-radius:50%;background:var(--accent);animation:pulse 1.1s ease-in-out infinite;flex:none}
@keyframes pulse{0%,100%{opacity:.25;transform:scale(.8)}50%{opacity:1;transform:scale(1.15)}}
.stop.off .cname{text-decoration:line-through;text-decoration-thickness:1px}

.chead{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.ctime{font-family:"IBM Plex Mono",monospace;font-size:13px;font-weight:500;color:var(--accent);flex:none}
.stop[data-kind="transit"] .ctime{color:var(--muted)}
.cname{font-family:"Noto Serif TC",serif;font-weight:700;font-size:17px;flex:1;min-width:140px;line-height:1.35}
.stop[data-kind="transit"] .cname{font-family:"Noto Sans TC",sans-serif;font-size:14.5px;font-weight:500;color:var(--muted)}
.cost{font-family:"IBM Plex Mono",monospace;font-size:14px;font-weight:500;white-space:nowrap}
.cost small{font-size:11px;color:var(--muted);font-weight:400;margin-left:3px}
.cost.free{color:var(--good)}

.crow{display:flex;gap:8px;margin-top:9px;font-size:13.5px;line-height:1.6}
.crow .k{
  flex:none;width:60px;font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.06em;
  color:var(--muted);padding-top:3px;text-transform:uppercase;
}
.crow .v{flex:1;min-width:0}
.crow.rain .v{color:var(--warn)}
.notes{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.note{font-size:12px;padding:2px 8px;border-radius:5px;background:var(--good-soft);color:var(--good)}
.note.book{background:var(--accent-soft);color:var(--accent)}
.flag{font-size:11.5px;padding:3px 9px;border-radius:5px;background:var(--surface-2);color:var(--muted);border:1px dashed var(--rail)}
.flag.warn{background:var(--warn-soft);color:var(--warn);border:1px solid transparent}
.cands{margin-top:11px;padding-top:10px;border-top:1px dashed var(--line)}
.cands .h{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--good);margin-bottom:7px}
.cands.none .h{color:var(--muted)}
.cand{display:flex;gap:8px;font-size:13.5px;line-height:1.55;margin-bottom:6px}
.cand .b{flex:none;color:var(--good);font-weight:700}
.cand .n{font-weight:500}
.cand .s{font-size:12px;color:var(--info);text-decoration:none;border-bottom:1px solid currentColor;white-space:nowrap;margin-left:4px}
.cand .s:hover{opacity:.75}
.checking{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);margin-top:10px}
.cfoot{display:flex;justify-content:flex-end;margin-top:10px;padding-top:9px;border-top:1px solid var(--line)}
.mini{
  background:none;border:1px solid var(--line);border-radius:7px;padding:3px 10px;
  font-size:12.5px;color:var(--muted);
}
.mini:hover{border-color:var(--accent);color:var(--accent)}

/* extras */
.extras{display:grid;gap:10px;grid-template-columns:1fr}
@media (min-width:640px){ .extras{grid-template-columns:1fr 1fr} }
.xcard{
  background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:13px 15px;
  display:flex;flex-direction:column;gap:6px;
}
.xcard h3{font-size:15.5px}
.xcard p{margin:0;font-size:13.5px;color:var(--muted)}
.xcard .xf{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:auto;padding-top:6px}

.tips{margin:0;padding-left:18px;font-size:13.5px;color:var(--muted)}
.tips li{margin-bottom:5px}

/* totals bar */
.totals{
  position:fixed;left:0;right:0;bottom:0;z-index:20;
  background:var(--surface);border-top:1px solid var(--line);
  box-shadow:0 -6px 22px -18px rgba(0,0,0,.6);
}
.totals-in{
  max-width:1180px;margin:0 auto;padding:11px 20px;
  display:flex;align-items:center;gap:14px 22px;flex-wrap:wrap;
}
.tbreak{display:flex;gap:16px;flex-wrap:wrap;flex:1;min-width:180px}
.tb{display:flex;flex-direction:column;line-height:1.25}
.tb .lab{font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.tb .val{font-family:"IBM Plex Mono",monospace;font-size:15px;font-weight:500}
.tb.big .val{font-size:22px;color:var(--accent);font-weight:600}
.budget{font-size:12.5px;padding:4px 10px;border-radius:6px;background:var(--good-soft);color:var(--good)}
.budget.over{background:var(--warn-soft);color:var(--warn)}

/* loading */
.loading{border:1px solid var(--line);border-radius:14px;background:var(--surface);padding:30px 26px;box-shadow:var(--shadow)}
.loading h2{font-size:18px;margin-bottom:6px}
.loading p{margin:0 0 18px;color:var(--muted);font-size:13.5px}
.bars{display:flex;flex-direction:column;gap:10px}
.bar{height:11px;border-radius:5px;background:var(--surface-2);overflow:hidden;position:relative}
.bar::after{
  content:"";position:absolute;inset:0;transform:translateX(-100%);
  background:linear-gradient(90deg,transparent,var(--accent-soft),transparent);
  animation:sweep 1.5s infinite;
}
.bar:nth-child(2){width:78%} .bar:nth-child(3){width:88%} .bar:nth-child(4){width:60%}
.bar:nth-child(2)::after{animation-delay:.15s} .bar:nth-child(3)::after{animation-delay:.3s} .bar:nth-child(4)::after{animation-delay:.45s}
@keyframes sweep{to{transform:translateX(100%)}}
@media (prefers-reduced-motion:reduce){ .bar::after,.pulse{animation:none} *{transition:none!important} }
.err{border:1px solid var(--line);border-left:3px solid var(--warn);border-radius:10px;background:var(--surface);padding:16px 18px}
.err h2{font-size:16px;margin-bottom:6px}
.err p{margin:0;font-size:14px;color:var(--muted)}
</style>

</head>
<body>
<div class="wrap">
  <header class="masthead">
    <div class="brand">
      <div class="sig">順</div>
      <div>
        <h1>順路走</h1>
        <p>需求進去，一條走得完的路線出來</p>
      </div>
    </div>
    <div class="spacer"></div>
    <div class="stampline" id="stamp">PROTOTYPE / v0.1</div>
  </header>

  <div class="cols">
    <form class="panel" id="form">
      <h2>這趟想怎麼走</h2>
      <p class="panel-sub">全部欄位都可以自由填，隨機也行。</p>

      <div class="duo">
        <div class="field">
          <label for="from">出發地</label>
          <input type="text" id="from" value="台中高鐵站">
        </div>
        <div class="field">
          <label for="to">目的地</label>
          <input type="text" id="to" value="台北">
        </div>
      </div>

      <div class="field">
        <label for="food">想吃什麼</label>
        <input type="text" id="food" value="義式料理">
        <div class="hintlinks" id="foodHints"></div>
      </div>

      <div class="duo">
        <div class="field">
          <label for="date">日期</label>
          <input type="date" id="date">
        </div>
        <div class="field">
          <label for="start">出發時間</label>
          <input type="time" id="start" value="09:00">
        </div>
      </div>

      <div class="duo">
        <div class="field">
          <label for="people">人數</label>
          <input type="number" id="people" value="2" min="1" max="20">
        </div>
        <div class="field">
          <label for="budget">每人預算 NT$</label>
          <input type="number" id="budget" value="3000" min="0" step="100">
        </div>
      </div>

      <div class="grp">
        <span class="lab">偏好交通方式</span>
        <div class="chips" id="transport"></div>
      </div>

      <div class="grp">
        <span class="lab">特殊要求</span>
        <div class="chips" id="needs"></div>
      </div>

      <div class="grp">
        <span class="lab">要包含</span>
        <div class="chips" id="include"></div>
      </div>

      <div class="field">
        <label for="notes">其他想說的</label>
        <textarea id="notes" placeholder="例如：不想走太多路、想在六點前回到高鐵站、有帶長輩"></textarea>
      </div>

      <div class="actions">
        <button type="submit" class="btn primary" id="go">排一條路線</button>
        <button type="button" class="btn dice" id="dice" title="隨機填入">隨機</button>
      </div>
      <div class="actions" style="margin-top:9px">
        <button type="button" class="btn" id="stop" hidden style="flex:1">停止</button>
      </div>
    </form>

    <main class="out" id="out"></main>
  </div>
</div>

<div class="totals" id="totals" hidden>
  <div class="totals-in">
    <div class="tbreak" id="tbreak"></div>
    <div class="tb big"><span class="lab">每人合計</span><span class="val mono" id="perHead">NT$0</span></div>
    <div class="tb"><span class="lab">全團</span><span class="val mono" id="grand">NT$0</span></div>
    <span class="budget" id="budgetChip">預算內</span>
  </div>
</div>

<script>
(function(){
  "use strict";

  var TRANSPORT = ["高鐵","台鐵","捷運","公車","計程車 / Uber","步行","YouBike","自行開車","客運"];
  var NEEDS = ["不吃辣","素食","無障礙","要開發票","帶小孩","帶寵物","不想排隊","不喝酒"];
  var INCLUDE = ["打卡景點","住宿","私房景點","雨天備案","伴手禮"];
  var FOODS = ["義式料理","日式居酒屋","小吃夜市","川菜","早午餐","素食","泰式","燒肉","海鮮"];
  var CITIES = ["台北","台中","台南","高雄","宜蘭","花蓮","嘉義","新竹","台東","屏東"];
  var ORIGINS = ["台中高鐵站","台北車站","桃園機場","左營高鐵站","板橋車站","新竹高鐵站","台南火車站"];

  var KIND_LABEL = {transit:"交通",food:"用餐",sight:"景點",stay:"住宿",other:"行程"};
  var COST_GROUP = {transit:"交通",food:"餐飲",sight:"門票",stay:"住宿",other:"其他"};

  var out = document.getElementById("out");
  var form = document.getElementById("form");
  var goBtn = document.getElementById("go");
  var stopBtn = document.getElementById("stop");
  var totalsBar = document.getElementById("totals");

  var state = null, ctl = null, timer = null;

  /* ---------- helpers ---------- */
  function esc(s){
    return String(s == null ? "" : s)
      .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
      .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
  }
  function money(n){ return "NT$" + Math.round(Number(n)||0).toLocaleString("en-US"); }
  function pick(a){ return a[Math.floor(Math.random()*a.length)]; }

  function buildChips(host, items, preset){
    host.innerHTML = items.map(function(t){
      var on = preset.indexOf(t) > -1;
      return '<label class="chip' + (on ? ' on' : '') + '">' +
             '<input type="checkbox" value="' + esc(t) + '"' + (on ? ' checked' : '') + '>' + esc(t) + '</label>';
    }).join("");
    host.addEventListener("change", function(e){
      if (e.target.tagName === "INPUT") e.target.parentNode.classList.toggle("on", e.target.checked);
    });
  }
  function chipValues(host){
    return Array.prototype.slice.call(host.querySelectorAll("input:checked")).map(function(i){ return i.value; });
  }

  buildChips(document.getElementById("transport"), TRANSPORT, ["高鐵","捷運","步行"]);
  buildChips(document.getElementById("needs"), NEEDS, ["不吃辣","要開發票"]);
  buildChips(document.getElementById("include"), INCLUDE, ["打卡景點","私房景點","雨天備案"]);

  document.getElementById("foodHints").innerHTML =
    FOODS.slice(0,6).map(function(f){ return '<button type="button" data-f="' + esc(f) + '">' + esc(f) + '</button>'; }).join("");
  document.getElementById("foodHints").addEventListener("click", function(e){
    if (e.target.dataset.f) document.getElementById("food").value = e.target.dataset.f;
  });

    var t = emptyTrip(f, isDemo);

  /** 讀 SSE：每個事件是 "event: X\ndata: {...}"，用空行分隔 */
  function streamPlan(f, signal, handlers){
    return fetch("/api/plan/stream", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify(f),
      signal: signal
    }).then(function(r){
      if (!r.ok || !r.body){
        return r.json().then(
          function(j){ throw {code: j.code, message: j.message}; },
          function(){ throw {code: "upstream_error"}; }
        );
      }
      var reader = r.body.getReader();
      var decoder = new TextDecoder();
      var buf = "";

      function flush(){
        var frames = buf.split("\n\n");
        buf = frames.pop();
        frames.forEach(function(frame){
          var ev = "message", data = "";
          frame.split("\n").forEach(function(line){
            if (line.indexOf("event:") === 0) ev = line.slice(6).trim();
            else if (line.indexOf("data:") === 0) data += line.slice(5).trim();
          });
          if (!data) return;
          var payload;
          try { payload = JSON.parse(data); } catch (err) { return; }
          if (handlers[ev]) handlers[ev](payload);
        });
      }

      function pump(){
        return reader.read().then(function(res){
          if (res.done){ flush(); return; }
          buf += decoder.decode(res.value, {stream: true});
          flush();
          return pump();
        });
      }
      return pump();
    });
  }

  form.addEventListener("submit", function(e){
    e.preventDefault();
    var f = readForm();
    ctl = new AbortController();
    goBtn.disabled = true;
    stopBtn.hidden = false;
    showLoading();

    var live = null;
    var errored = false;

    function begin(meta){
      live = emptyTrip(f, false);
      live.streaming = true;
      live.title = (meta && meta.title) || (f.to + " " + f.food + "路線");
      live.summary = (meta && meta.summary) || "";
      state = live;
      render();
    }

    streamPlan(f, ctl.signal, {
      meta: function(m){ begin(m); },
      stop: function(x){
        if (!live) begin(null);
        live.stops.push(normStop(x, live.stops.length));
        render();
      },
      extra: function(x){
        if (!live) begin(null);
        live.extras.push(normExtra(x, live.extras.length));
        render();
      },
      done: function(d){
        if (!live) return showError("empty_plan");
        live.streaming = false;
        live.mock = !!(d && d.mock);
        live.demo = live.mock;
        live.tips = (d && d.tips) || [];
        if (d && d.verifying > 0){
          live.stops.forEach(function(x){
            if (x.kind !== "transit" && x.verified !== "landmark") x.checking = true;
          });
        }
        render();
      },
      verify: function(v){
        if (!live) return;
        var target = live.stops[v.index];
        if (!target) return;
        target.checking = false;
        target.candidates = v.candidates || [];
        render();
      },
      end: function(){
        if (!live) return;
        live.stops.forEach(function(x){ x.checking = false; });
        render();
      },
      error: function(err){
        errored = true;
        showError(err && err.code, err && err.message);
      }
    })
      .catch(function(err){
        if (errored) return;
        if (err && err.name === "AbortError") return showError("cancelled");
        showError((err && err.code) || "network", err && err.message);
      })
      .then(function(){
        clearInterval(timer);
        goBtn.disabled = false;
        stopBtn.hidden = true;
      });
  });
