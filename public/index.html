<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>順路走 行程機</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans+JP:wght@400;500;700&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;700&display=swap">
<style>
html,body{margin:0}
img{max-width:100%}
:root{
  --bg:#FAF6F1; --surface:#FFFFFF; --surface-2:#F3ECE4; --sunk:#EFE7DD;
  --ink:#1C1815; --muted:#7C6F64; --line:#E4DAD0;
  --accent:#D9531E; --accent-ink:#FFFFFF; --accent-soft:#FBEADF;
  --rail:#C3B4A5;
  --good:#2E7D57; --good-soft:#E4F1EA;
  --warn:#9E6913; --warn-soft:#F7EBD6;
  --info:#1D6FA3; --info-soft:#E4EFF7;
  --shadow:0 1px 2px rgba(28,24,21,.05), 0 8px 24px -16px rgba(28,24,21,.28);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#14110E; --surface:#1E1A16; --surface-2:#272119; --sunk:#191510;
    --ink:#F3ECE3; --muted:#A2948A; --line:#342C24;
    --accent:#F26F3C; --accent-ink:#1A1109; --accent-soft:#3A2317;
    --rail:#4C4137;
    --good:#5FBE8F; --good-soft:#16281F;
    --warn:#E2AC5A; --warn-soft:#2C2114;
    --info:#74B8E6; --info-soft:#152532;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -16px rgba(0,0,0,.8);
  }
}
:root[data-theme="dark"]{
  --bg:#14110E; --surface:#1E1A16; --surface-2:#272119; --sunk:#191510;
  --ink:#F3ECE3; --muted:#A2948A; --line:#342C24;
  --accent:#F26F3C; --accent-ink:#1A1109; --accent-soft:#3A2317;
  --rail:#4C4137;
  --good:#5FBE8F; --good-soft:#16281F;
  --warn:#E2AC5A; --warn-soft:#2C2114;
  --info:#74B8E6; --info-soft:#152532;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -16px rgba(0,0,0,.8);
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  font-size:15px; line-height:1.65; -webkit-font-smoothing:antialiased;
}
/* 日文的漢字字形跟繁中不同，語言切到日文時換一套字 */
html[lang="ja"] body{font-family:"Noto Sans JP","Hiragino Sans","Yu Gothic",system-ui,sans-serif}
html[lang="en"] body,html[lang="fr"] body{
  font-family:system-ui,-apple-system,"Segoe UI",Helvetica,Arial,"Noto Sans TC",sans-serif;
}
h1,h2,h3{font-family:"Noto Serif TC",Georgia,"Songti TC",serif;font-weight:700;margin:0;text-wrap:balance;line-height:1.3}
html[lang="en"] h1,html[lang="en"] h2,html[lang="en"] h3,
html[lang="fr"] h1,html[lang="fr"] h2,html[lang="fr"] h3{font-family:Georgia,"Times New Roman",serif}
html[lang="ja"] h1,html[lang="ja"] h2,html[lang="ja"] h3{font-family:"Noto Sans JP","Hiragino Sans",sans-serif}
.mono{font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}

/* ---------- shell ---------- */
.wrap{max-width:1180px;margin:0 auto;padding:0 20px 132px}
.masthead{
  border-bottom:1px solid var(--line); padding:26px 0 20px; margin-bottom:26px;
  display:flex;flex-wrap:wrap;align-items:flex-end;gap:14px 20px;
}
.brand{display:flex;align-items:center;gap:12px}
.sig{
  width:38px;height:38px;border-radius:10px;background:var(--accent);color:var(--accent-ink);
  display:grid;place-items:center;font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:17px;flex:none;
}
.brand h1{font-size:23px;letter-spacing:.01em}
.brand p{margin:1px 0 0;font-size:12.5px;color:var(--muted);letter-spacing:.06em}
.masthead .spacer{flex:1}
.headright{display:flex;align-items:center;gap:14px}
.stampline{
  font-family:"IBM Plex Mono",monospace;font-size:11.5px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--muted);
}
.langs{display:flex;gap:2px;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.langs button{
  border:none;background:none;padding:5px 10px;font-size:12.5px;color:var(--muted);
  font-family:"IBM Plex Mono",monospace;letter-spacing:.04em;
}
.langs button:hover{background:var(--surface-2)}
.langs button.on{background:var(--accent);color:var(--accent-ink);font-weight:600}

.cols{display:grid;grid-template-columns:1fr;gap:26px}
@media (min-width:960px){ .cols{grid-template-columns:352px minmax(0,1fr);gap:34px;align-items:start} }

/* ---------- form panel ---------- */
.panel{
  background:var(--surface);border:1px solid var(--line);border-radius:14px;
  padding:20px;box-shadow:var(--shadow);
}
@media (min-width:960px){ .panel{position:sticky;top:18px;max-height:calc(100vh - 36px);overflow-y:auto} }
.panel h2{font-size:15px;margin-bottom:2px}
.panel-sub{font-size:12.5px;color:var(--muted);margin:0 0 16px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:15px}
.field > label, .grp > .lab{
  font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:500;
  font-family:"IBM Plex Mono",monospace;
}
input[type=text],input[type=number],input[type=date],input[type=time],textarea,select{
  width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;
  background:var(--sunk);color:var(--ink);font:inherit;font-size:14.5px;
}
input:focus,textarea:focus{outline:none;border-color:var(--accent);background:var(--surface)}
textarea{resize:vertical;min-height:60px}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grp{margin-bottom:15px}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:7px}
.chip{
  display:inline-flex;align-items:center;gap:5px;padding:5px 11px;border-radius:999px;
  border:1px solid var(--line);background:var(--surface-2);font-size:13px;color:var(--muted);
  transition:background .14s,color .14s,border-color .14s;
}
.chip:hover{border-color:var(--rail)}
.chip input{position:absolute;opacity:0;width:0;height:0}
.chip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:500}

/* 地點自動完成 */
.ac{position:relative}
.ac-list{
  position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:30;
  background:var(--surface);border:1px solid var(--line);border-radius:10px;
  box-shadow:var(--shadow);overflow:hidden;max-height:270px;overflow-y:auto;
}
.ac-list[hidden]{display:none}
.ac-item{
  display:block;width:100%;text-align:left;background:none;border:none;
  padding:9px 12px;border-bottom:1px solid var(--line);line-height:1.4;
}
.ac-item:last-child{border-bottom:none}
.ac-item:hover,.ac-item.sel{background:var(--accent-soft)}
.ac-item .m{font-size:14px;font-weight:500;display:block}
.ac-item .s{font-size:12px;color:var(--muted);display:block;margin-top:1px}
.locbtn{
  align-self:flex-start;background:none;border:none;padding:2px 0;margin-top:2px;
  font-size:12.5px;color:var(--info);text-decoration:underline;text-underline-offset:3px;
  max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.locbtn:disabled{opacity:.55;cursor:default;text-decoration:none}

.saved{margin-top:22px;padding-top:16px;border-top:1px solid var(--line)}
.saved-head{display:flex;align-items:center;gap:10px;margin-bottom:9px}
.saved-head .lab{flex:1;font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-family:"IBM Plex Mono",monospace}
.saved-head .mini{padding:3px 9px;font-size:12px}
.srow{display:flex;align-items:baseline;gap:8px;padding:7px 0;border-bottom:1px solid var(--line)}
.srow:last-child{border-bottom:none}
.srow .n{flex:1;min-width:0;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.srow .d{font-size:11px;color:var(--muted);font-family:"IBM Plex Mono",monospace;flex:none}
.srow button{background:none;border:none;padding:0 2px;font-size:12px;color:var(--info);text-decoration:underline;text-underline-offset:2px;flex:none}
.srow button.del{color:var(--muted)}
.srow button.del:hover{color:var(--warn)}
.empty-saved{font-size:12.5px;color:var(--muted);padding:4px 0}

.hintlinks{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px}
.hintlinks button{
  background:none;border:none;padding:2px 0;font-size:12.5px;color:var(--info);
  text-decoration:underline;text-underline-offset:3px;
}
.actions{display:flex;gap:9px;margin-top:18px}
.btn{
  border:1px solid var(--line);background:var(--surface-2);border-radius:9px;
  padding:11px 15px;font-size:14.5px;font-weight:500;
}
.btn:hover{border-color:var(--rail)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);flex:1}
.btn.primary:hover{filter:brightness(1.06)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.dice{flex:none;padding:11px 13px}

/* ---------- output ---------- */
.out{min-height:320px}
.empty{
  border:1px dashed var(--line);border-radius:14px;padding:46px 26px;text-align:center;color:var(--muted);
  background:var(--surface);
}
.empty h2{font-size:19px;color:var(--ink);margin-bottom:8px}
.empty p{margin:0 auto;max-width:44ch;font-size:14px}
.empty .demo{margin-top:20px}

.notice{
  display:flex;gap:10px;align-items:flex-start;padding:11px 14px;border-radius:10px;
  background:var(--warn-soft);color:var(--warn);font-size:13px;margin-bottom:18px;border:1px solid transparent;
}
.notice.demo{background:var(--info-soft);color:var(--info)}
.notice b{font-weight:700}

.trip-head{margin-bottom:20px}
.trip-head h2{font-size:26px;margin-bottom:6px}
.trip-head p{margin:0;color:var(--muted);font-size:14.5px;max-width:62ch}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.tag{
  font-family:"IBM Plex Mono",monospace;font-size:11.5px;letter-spacing:.04em;
  padding:3px 9px;border-radius:5px;background:var(--surface-2);color:var(--muted);border:1px solid var(--line);
}

.secttl{
  display:flex;align-items:center;gap:10px;margin:30px 0 14px;
  font-family:"IBM Plex Mono",monospace;font-size:11.5px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--muted);
}
.secttl::after{content:"";flex:1;height:1px;background:var(--line)}

.dayline{display:flex;align-items:center;gap:12px;margin:22px 0 12px}
.dayline:first-child{margin-top:0}
.daytag{
  flex:none;font-family:"IBM Plex Mono",monospace;font-size:12px;font-weight:600;letter-spacing:.1em;
  padding:4px 12px;border-radius:6px;background:var(--accent);color:var(--accent-ink);
}
.dayline .rule{flex:1;height:1px;background:var(--line)}
.dayline .sub{font-size:12.5px;color:var(--muted);font-family:"IBM Plex Mono",monospace}

.toolbar{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 4px}
.toolbar .mini{padding:6px 13px;font-size:13px}
.toolbar .mini.act{border-color:var(--accent);color:var(--accent)}
.toolbar .mini:disabled{opacity:.55;cursor:default}
.hint{font-size:12.5px;color:var(--muted);margin:8px 0 0;line-height:1.55}
.hint.warn{color:var(--warn)}

.ins{display:grid;grid-template-columns:44px minmax(0,1fr);}
.ins .rail{position:relative}
.ins .rail::before{content:"";position:absolute;left:20px;top:0;bottom:0;width:2px;background:var(--rail)}
.insbtn{
  align-self:center;background:none;border:1px dashed var(--line);border-radius:8px;
  padding:3px 11px;font-size:12px;color:var(--muted);margin:2px 0 8px;justify-self:start;
}
.insbtn:hover{border-color:var(--accent);color:var(--accent)}
.insform{background:var(--surface);border:1px solid var(--accent);border-radius:11px;padding:12px 14px;margin-bottom:10px}
.insform input{margin-bottom:9px}
.insform .kinds{display:flex;gap:7px;margin-bottom:10px;flex-wrap:wrap}
.insform .kinds button{
  border:1px solid var(--line);background:var(--surface-2);border-radius:999px;
  padding:4px 12px;font-size:13px;color:var(--muted);
}
.insform .kinds button.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:500}
.insform .go{display:flex;gap:8px;justify-content:flex-end}

.maps{display:flex;gap:8px;margin-top:9px;flex-wrap:wrap}
.maps a{
  font-size:12px;color:var(--info);text-decoration:none;border:1px solid var(--line);
  border-radius:6px;padding:2px 9px;
}
.maps a:hover{border-color:var(--info);background:var(--info-soft)}

/* timeline */
.timeline{display:flex;flex-direction:column}
.stop{display:grid;grid-template-columns:44px minmax(0,1fr);padding-bottom:14px}
.rail{position:relative}
.rail::before{content:"";position:absolute;left:20px;top:0;bottom:-14px;width:2px;background:var(--rail)}
.stop:first-child .rail::before{top:22px}
.stop:last-child .rail::before{bottom:auto;height:22px}
.dot{
  position:absolute;left:12px;top:14px;width:18px;height:18px;border-radius:50%;
  background:var(--surface);border:3px solid var(--rail);z-index:1;
}
.stop[data-kind="food"] .dot{border-color:var(--accent)}
.stop[data-kind="sight"] .dot{border-color:var(--good)}
.stop[data-kind="stay"] .dot{border-color:var(--info)}
.stop[data-kind="transit"] .dot{width:12px;height:12px;left:15px;top:18px;border-width:2px;background:var(--rail);border-color:var(--rail)}

.card{
  background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;
  box-shadow:var(--shadow);transition:opacity .18s;
}
.stop[data-kind="transit"] .card{background:var(--surface-2);box-shadow:none;padding:11px 14px}
.stop.off .card{opacity:.42}
.stop.pending .dot{border-color:var(--rail);background:var(--surface)}
.stop.pending .card{display:flex;align-items:center;gap:10px;background:var(--surface-2);box-shadow:none;color:var(--muted);font-size:13.5px}
.pulse{width:8px;height:8px;border-radius:50%;background:var(--accent);animation:pulse 1.1s ease-in-out infinite;flex:none}
@keyframes pulse{0%,100%{opacity:.25;transform:scale(.8)}50%{opacity:1;transform:scale(1.15)}}
.stop.off .cname{text-decoration:line-through;text-decoration-thickness:1px}

.chead{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.ctime{font-family:"IBM Plex Mono",monospace;font-size:13px;font-weight:500;color:var(--accent);flex:none}
.stop[data-kind="transit"] .ctime{color:var(--muted)}
.cname{font-family:"Noto Serif TC",serif;font-weight:700;font-size:17px;flex:1;min-width:140px;line-height:1.35}
html[lang="en"] .cname,html[lang="fr"] .cname{font-family:Georgia,serif}
html[lang="ja"] .cname{font-family:"Noto Sans JP",sans-serif}
.stop[data-kind="transit"] .cname{font-family:inherit;font-size:14.5px;font-weight:500;color:var(--muted)}
.cost{font-family:"IBM Plex Mono",monospace;font-size:14px;font-weight:500;white-space:nowrap}
.cost small{font-size:11px;color:var(--muted);font-weight:400;margin-left:3px}
.cost.free{color:var(--good)}

.crow{display:flex;gap:8px;margin-top:9px;font-size:13.5px;line-height:1.6}
.crow .k{
  flex:none;width:64px;font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.04em;
  color:var(--muted);padding-top:3px;text-transform:uppercase;
}
.crow .v{flex:1;min-width:0}
html[lang="en"] .crow .k,html[lang="fr"] .crow .k{width:92px}
.crow.rain .v{color:var(--warn)}
.notes{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.note{font-size:12px;padding:2px 8px;border-radius:5px;background:var(--good-soft);color:var(--good)}
.note.book{background:var(--accent-soft);color:var(--accent)}
.flag{font-size:11.5px;padding:3px 9px;border-radius:5px;background:var(--surface-2);color:var(--muted);border:1px dashed var(--rail)}
.flag.warn{background:var(--warn-soft);color:var(--warn);border:1px solid transparent}

.cands{margin-top:11px;padding-top:10px;border-top:1px dashed var(--line)}
.cands .h{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--good);margin-bottom:7px}
.cands.none .h{color:var(--muted)}
.cand{display:flex;gap:8px;font-size:13.5px;line-height:1.55;margin-bottom:6px}
.cand .b{flex:none;color:var(--good);font-weight:700}
.cand .n{font-weight:500}
.cand .s{font-size:12px;color:var(--info);text-decoration:none;border-bottom:1px solid currentColor;white-space:nowrap;margin-left:4px}
.cand .s:hover{opacity:.75}
.checking{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);margin-top:10px}

.book{margin-top:11px;padding-top:10px;border-top:1px dashed var(--line)}
.book .h{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--info);margin-bottom:8px}
.book .row{display:flex;flex-wrap:wrap;gap:8px}
.book a{
  display:inline-flex;align-items:center;gap:6px;padding:6px 13px;border-radius:8px;
  border:1px solid var(--info);color:var(--info);text-decoration:none;font-size:13.5px;font-weight:500;
}
.book a:hover{background:var(--info-soft)}
.book .why{margin-top:8px;font-size:12.5px;color:var(--muted);line-height:1.55}

.cfoot{display:flex;justify-content:flex-end;margin-top:10px;padding-top:9px;border-top:1px solid var(--line)}
.mini{background:none;border:1px solid var(--line);border-radius:7px;padding:3px 10px;font-size:12.5px;color:var(--muted)}
.mini:hover{border-color:var(--accent);color:var(--accent)}

.extras{display:grid;gap:10px;grid-template-columns:1fr}
@media (min-width:640px){ .extras{grid-template-columns:1fr 1fr} }
.xcard{background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:13px 15px;display:flex;flex-direction:column;gap:6px}
.xcard h3{font-size:15.5px}
.xcard p{margin:0;font-size:13.5px;color:var(--muted)}
.xcard .xf{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:auto;padding-top:6px}

.tips{margin:0;padding-left:18px;font-size:13.5px;color:var(--muted)}
.tips li{margin-bottom:5px}

.totals{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);box-shadow:0 -6px 22px -18px rgba(0,0,0,.6)}
.totals-in{max-width:1180px;margin:0 auto;padding:11px 20px;display:flex;align-items:center;gap:14px 22px;flex-wrap:wrap}
.tbreak{display:flex;gap:16px;flex-wrap:wrap;flex:1;min-width:180px}
.tb{display:flex;flex-direction:column;line-height:1.25}
.tb .lab{font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.tb .val{font-family:"IBM Plex Mono",monospace;font-size:15px;font-weight:500}
.tb.big .val{font-size:22px;color:var(--accent);font-weight:600}
.budget{font-size:12.5px;padding:4px 10px;border-radius:6px;background:var(--good-soft);color:var(--good)}
.budget.over{background:var(--warn-soft);color:var(--warn)}

.loading{border:1px solid var(--line);border-radius:14px;background:var(--surface);padding:30px 26px;box-shadow:var(--shadow)}
.loading h2{font-size:18px;margin-bottom:6px}
.loading p{margin:0 0 18px;color:var(--muted);font-size:13.5px}
.bars{display:flex;flex-direction:column;gap:10px}
.bar{height:11px;border-radius:5px;background:var(--surface-2);overflow:hidden;position:relative}
.bar::after{content:"";position:absolute;inset:0;transform:translateX(-100%);background:linear-gradient(90deg,transparent,var(--accent-soft),transparent);animation:sweep 1.5s infinite}
.bar:nth-child(2){width:78%} .bar:nth-child(3){width:88%} .bar:nth-child(4){width:60%}
@keyframes sweep{to{transform:translateX(100%)}}
@media (prefers-reduced-motion:reduce){ .bar::after,.pulse{animation:none} *{transition:none!important} }
.err{border:1px solid var(--line);border-left:3px solid var(--warn);border-radius:10px;background:var(--surface);padding:16px 18px}
.err h2{font-size:16px;margin-bottom:6px}
.err p{margin:0;font-size:14px;color:var(--muted)}

/* ---------- 列印（Cmd+P → 存成 PDF）---------- */
@media print{
  @page{margin:14mm 12mm}
  html,body{background:#fff!important;color:#000!important}
  .masthead .langs,.panel,.totals,.toolbar,.notice,.cfoot,.insbtn,.insform,
  .maps,.checking,.empty,.loading{display:none!important}
  .wrap{max-width:none;padding:0}
  .cols{display:block}
  .masthead{border-bottom:1px solid #999;margin-bottom:14px;padding:0 0 10px}
  .stampline{display:none}
  .card{box-shadow:none!important;border:1px solid #ccc;background:#fff!important;break-inside:avoid}
  .stop{break-inside:avoid;page-break-inside:avoid}
  .dayline{break-after:avoid}
  .daytag{background:#000!important;color:#fff!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .trip-head h2{font-size:20px}
  .cands,.book{border-top:1px dashed #bbb}
  .cand .s{display:none}          /* 紙上點不了連結，留網址反而礙眼 */
  .book .row{display:none}
  a{color:#000!important;text-decoration:none}
  .secttl::after{background:#ccc}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="masthead">
    <div class="brand">
      <div class="sig">順</div>
      <div>
        <h1 data-i18n="brand">順路走</h1>
        <p data-i18n="tagline">需求進去，一條走得完的路線出來</p>
      </div>
    </div>
    <div class="spacer"></div>
    <div class="headright">
      <div class="stampline" id="stamp"></div>
      <div class="langs" id="langs"></div>
    </div>
  </header>

  <div class="cols">
    <form class="panel" id="form">
      <h2 data-i18n="formTitle"></h2>
      <p class="panel-sub" data-i18n="formSub"></p>

      <div class="duo">
        <div class="field">
          <label for="from" data-i18n="from"></label>
          <div class="ac"><input type="text" id="from" autocomplete="off"></div>
          <button type="button" class="locbtn" id="locBtn" data-i18n="useMyLocation"></button>
        </div>
        <div class="field">
          <label for="to" data-i18n="to"></label>
          <div class="ac"><input type="text" id="to" autocomplete="off"></div>
        </div>
      </div>

      <div class="field">
        <label for="food" data-i18n="food"></label>
        <input type="text" id="food">
        <div class="hintlinks" id="foodHints"></div>
      </div>

      <div class="duo">
        <div class="field">
          <label for="date" data-i18n="date"></label>
          <input type="date" id="date">
        </div>
        <div class="field">
          <label for="start" data-i18n="startTime"></label>
          <input type="time" id="start" value="09:00">
        </div>
      </div>

      <div class="duo">
        <div class="field">
          <label for="days" data-i18n="days"></label>
          <select id="days">
            <option value="1" data-i18n="day1"></option>
            <option value="2" data-i18n="day2"></option>
            <option value="3" data-i18n="day3"></option>
          </select>
        </div>
        <div class="field">
          <label for="people" data-i18n="people"></label>
          <input type="number" id="people" value="2" min="1" max="20">
        </div>
      </div>

      <div class="field">
        <label for="budget" data-i18n="budget"></label>
        <input type="number" id="budget" value="3000" min="0" step="100">
      </div>

      <div class="grp">
        <span class="lab" data-i18n="transport"></span>
        <div class="chips" id="transport"></div>
      </div>

      <div class="grp">
        <span class="lab" data-i18n="needs"></span>
        <div class="chips" id="needs"></div>
      </div>

      <div class="grp">
        <span class="lab" data-i18n="include"></span>
        <div class="chips" id="include"></div>
      </div>

      <div class="field">
        <label for="notes" data-i18n="notesLabel"></label>
        <textarea id="notes"></textarea>
      </div>

      <div class="actions">
        <button type="submit" class="btn primary" id="go" data-i18n="go"></button>
        <button type="button" class="btn dice" id="dice" data-i18n="dice"></button>
      </div>
      <div class="actions" style="margin-top:9px">
        <button type="button" class="btn" id="stop" hidden style="flex:1" data-i18n="stopBtn"></button>
      </div>

      <div class="saved">
        <div class="saved-head">
          <span class="lab" data-i18n="myTrips"></span>
          <button type="button" class="mini" id="importBtn" data-i18n="importJson"></button>
          <input type="file" id="importFile" accept="application/json,.json" hidden>
        </div>
        <div id="savedList"></div>
      </div>
    </form>

    <main class="out" id="out"></main>
  </div>
</div>

<div class="totals" id="totals" hidden>
  <div class="totals-in">
    <div class="tbreak" id="tbreak"></div>
    <div class="tb big"><span class="lab" data-i18n="perPerson"></span><span class="val mono" id="perHead">NT$0</span></div>
    <div class="tb"><span class="lab" data-i18n="groupTotal"></span><span class="val mono" id="grand">NT$0</span></div>
    <span class="budget" id="budgetChip"></span>
  </div>
</div>

  var LANGS = ["zh-TW","en","fr","ja"];

  /**
   * 裝置語言判斷。中文一律走繁中（我們的內容是台灣的），
   * 日文、法文各自對應，其餘一律英文 —— 對外國旅客來說，
   * 看不懂的繁中比英文糟得多。
   */
  function detectLang(){
    try {
      var saved = localStorage.getItem("shunlu.lang");
      if (saved && I18N[saved]) return saved;
    } catch (e) { /* 無痕模式等情況，忽略 */ }

    var list = navigator.languages && navigator.languages.length
      ? navigator.languages : [navigator.language || "en"];
    for (var i = 0; i < list.length; i++){
      var code = String(list[i] || "").toLowerCase();
      if (code.indexOf("zh") === 0) return "zh-TW";
      if (code.indexOf("ja") === 0) return "ja";
      if (code.indexOf("fr") === 0) return "fr";
      if (code.indexOf("en") === 0) return "en";
    }
    return "en";
  }

  var LANG = detectLang();

  function esc(s){
    return String(s == null ? "" : s)
      .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
      .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
  }
  function money(n){ return "NT$" + Math.round(Number(n)||0).toLocaleString("en-US"); }
  function pick(a){ return a[Math.floor(Math.random()*a.length)]; }
  function pad2(n){ return (n < 10 ? "0" : "") + n; }
  function unit(u){ return L().units[u] || u; }

  function addDays(iso, n){
    if (!iso) return "";
    var d = new Date(iso + "T00:00:00");
    if (isNaN(d.getTime())) return "";
    d.setDate(d.getDate() + n);
    return d.getFullYear() + "-" + pad2(d.getMonth()+1) + "-" + pad2(d.getDate());
  }

  function buildChips(host, items, presetIdx){
    host.innerHTML = items.map(function(text, i){
      var on = presetIdx.indexOf(i) > -1;
      return '<label class="chip' + (on ? ' on' : '') + '">' +
             '<input type="checkbox" value="' + esc(text) + '"' + (on ? ' checked' : '') + '>' +
             esc(text) + '</label>';
    }).join("");
  }
  function chipValues(host){
    return Array.prototype.slice.call(host.querySelectorAll("input:checked")).map(function(i){ return i.value; });
  }
  function chipCheckedIdx(host){
    var boxes = host.querySelectorAll("input"), out = [];
    for (var i = 0; i < boxes.length; i++) if (boxes[i].checked) out.push(i);
    return out;
  }

  /* ==================== 地點自動完成 ==================== */

  var acAvailable = true;
  function newSession(){ return Math.random().toString(36).slice(2) + Date.now().toString(36); }

  function attachAutocomplete(input){
    var box = document.createElement("div");
    box.className = "ac-list"; box.hidden = true;
    input.parentNode.appendChild(box);
    var items = [], sel = -1, session = newSession(), timer = null, ctl = null;

    function close(){ box.hidden = true; items = []; sel = -1; }
    function paint(){
      if (!items.length) return close();
      box.innerHTML = items.map(function(it, i){
        return '<button type="button" class="ac-item' + (i === sel ? ' sel' : '') + '" data-i="' + i + '">' +
               '<span class="m">' + esc(it.main) + '</span>' +
               (it.secondary ? '<span class="s">' + esc(it.secondary) + '</span>' : '') + '</button>';
      }).join("");
      box.hidden = false;
    }
    function choose(i){
      var it = items[i];
      if (!it) return;
      input.value = it.main;
      input.dataset.pristine = "0";
      session = newSession();
      close();
    }
    function fetchNow(){
      var q = input.value.trim();
      if (!acAvailable || q.length < 2) return close();
      if (ctl) ctl.abort();
      ctl = new AbortController();
      fetch("/api/places?q=" + encodeURIComponent(q) +
            "&session=" + encodeURIComponent(session) +
            "&lang=" + encodeURIComponent(LANG), {signal: ctl.signal})
        .then(function(r){ return r.json(); })
        .then(function(j){
          if (j.code === "no_google"){ acAvailable = false; return close(); }
          items = j.suggestions || []; sel = -1; paint();
        })
        .catch(function(){ /* 中止或連線問題，安靜關掉 */ });
    }

    input.addEventListener("input", function(){
      clearTimeout(timer);
      timer = setTimeout(fetchNow, 260);   // 每個字都問 Google 太浪費
    });
    input.addEventListener("keydown", function(e){
      if (box.hidden || !items.length) return;
      if (e.key === "ArrowDown"){ e.preventDefault(); sel = (sel+1)%items.length; paint(); }
      else if (e.key === "ArrowUp"){ e.preventDefault(); sel = (sel-1+items.length)%items.length; paint(); }
      else if (e.key === "Enter" && sel >= 0){ e.preventDefault(); choose(sel); }
      else if (e.key === "Escape"){ close(); }
    });
    box.addEventListener("mousedown", function(e){
      var btn = e.target.closest("[data-i]");
      if (btn){ e.preventDefault(); choose(Number(btn.dataset.i)); }
    });
    input.addEventListener("blur", function(){ setTimeout(close, 120); });
  }
  attachAutocomplete(document.getElementById("from"));
  attachAutocomplete(document.getElementById("to"));

  document.getElementById("locBtn").addEventListener("click", function(){
    var btn = this, fromInput = document.getElementById("from"), l = L();
    function reset(msg){
      btn.textContent = msg;
      setTimeout(function(){ btn.disabled = false; btn.textContent = L().useMyLocation; }, 2600);
    }
    if (!navigator.geolocation){ btn.disabled = true; btn.textContent = l.locNoSupport; return; }
    btn.disabled = true; btn.textContent = l.locating;

    navigator.geolocation.getCurrentPosition(function(pos){
      fetch("/api/whereami?lat=" + pos.coords.latitude + "&lng=" + pos.coords.longitude +
            "&lang=" + encodeURIComponent(LANG))
        .then(function(r){ return r.json(); })
        .then(function(j){
          if (j.ok && j.name){
            fromInput.value = j.name;
            fromInput.dataset.pristine = "0";
            reset(L().locDone);
          } else {
            reset(j.code === "no_google" ? L().locNoKey : L().locFail);
          }
        })
        .catch(function(){ reset(L().locFail); });
    }, function(err){
      reset(err.code === 1 ? L().locDenied : L().locFail);
    }, {timeout: 9000, maximumAge: 60000});
  });

      verified: (s && s.verified) || "unverified",
      candidates: null,
      checking: false,
      rainPlan: (s && s.rainPlan) || "",
      notes: Array.isArray(s && s.notes) ? s.notes : [],
      booking: (s && s.booking) || "",
      off: false
    };
  }
  function normExtra(x, i){
    return {
      id: "x" + i + "_" + Math.random().toString(36).slice(2,6),
      kind: (x && L().kinds[x.kind]) ? x.kind : "sight",
      name: (x && x.name) || "—",
      why: (x && x.why) || "",
      area: (x && x.area) || "",
      cost: Number(x && x.cost) || 0,
      costUnit: (x && x.costUnit) || "每人",
      added: false
    };
  }
  function emptyTrip(f, isDemo){
    return {demo: !!isDemo, mock:false, streaming:false, edited:false, replanning:false, replanNote:"",
            insertAt:-1, insertKind:"sight", insertName:"", justSaved:false, form:f, title:"", summary:"", tips:[], stops:[], extras:[]};
  }
  function normalize(raw, f, isDemo){
    var tr = emptyTrip(f, isDemo);
    tr.title = (raw && raw.title) || (f.to + " · " + f.food);
    tr.summary = (raw && raw.summary) || "";
    tr.tips = Array.isArray(raw && raw.tips) ? raw.tips : [];
    tr.stops = (Array.isArray(raw && raw.stops) ? raw.stops : []).map(normStop);
    tr.extras = (Array.isArray(raw && raw.extras) ? raw.extras : []).map(normExtra);
    return tr;
  }

  function stopCostPerHead(s, people){
    return s.costUnit === "每組" ? s.cost / people : s.cost;
  }
  function totals(){
    var people = state.form.people, groups = {}, perHead = 0;
    state.stops.forEach(function(s){
      if (s.off) return;
      var c = stopCostPerHead(s, people);
      if (!c) return;
      groups[s.kind] = (groups[s.kind] || 0) + c;
      perHead += c;
    });
    return {groups: groups, perHead: perHead, grand: perHead * people};
  }
  function dayCost(day){
    var people = state.form.people, sum = 0;
    state.stops.forEach(function(s){ if (!s.off && s.day === day) sum += stopCostPerHead(s, people); });
    return sum;
  }

  /* ==================== 渲染 ==================== */

  function bookingBlock(f, s){
    if (s.kind !== "stay") return "";
    var l = L();
    var where = [f.to, s.area].filter(Boolean).join(" ");
    var checkin = addDays(f.date, s.day - 1);
    var checkout = addDays(f.date, s.day);
    var booking = "https://www.booking.com/searchresults.html?ss=" + encodeURIComponent(where) +
      (checkin ? "&checkin=" + checkin + "&checkout=" + checkout : "") +
      "&group_adults=" + f.people + "&no_rooms=1&group_children=0";
    var google = "https://www.google.com/travel/search?q=" + encodeURIComponent(where + " hotel");
    return '<div class="book"><div class="h">' + esc(l.bookTitle) + '</div>' +
      '<div class="row">' +
        '<a href="' + esc(booking) + '" target="_blank" rel="noopener">Booking.com</a>' +
        '<a href="' + esc(google) + '" target="_blank" rel="noopener">Google</a>' +
      '</div>' +
      '<div class="why">' + esc(l.bookWhen(checkin, checkout, f.people)) + '　' + esc(l.bookWhy) + '</div></div>';
  }

  /**
   * 地圖連結。搜尋用「站名 + 行政區 + 城市」，導航則從上一站出發 ——
   * 使用者要的通常不是「這在哪」，而是「我現在在上一站，怎麼過去」。
   */
  function isDriving(){
    return (state.form.transport || []).some(function(x){
      return /自行開車|Rental car|Voiture de location|レンタカー/.test(x);
    });
  }

  function mapLinks(s, prev){
    var l = L(), f = state.form;
    var here = [s.name, s.area, f.to].filter(Boolean).join(" ");
    var search = "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(here);
    var html = '<a href="' + esc(search) + '" target="_blank" rel="noopener">' + esc(l.mapOpen) + '</a>';

    var drive = isDriving();
    if (prev){
      var dir = "https://www.google.com/maps/dir/?api=1" +
        "&origin=" + encodeURIComponent([prev.name, prev.area, f.to].filter(Boolean).join(" ")) +
        "&destination=" + encodeURIComponent(here) +
        "&travelmode=" + (drive ? "driving" : "transit");
      html += '<a href="' + esc(dir) + '" target="_blank" rel="noopener">' + esc(l.mapNav) + '</a>';
    }

    if (drive){
      // 不自己抓停車場資料：Google 地圖的停車場圖層有位置、營業時間，
      // 部分還有費率 —— 我們用 Places API 抓回來的會更少而且要付錢。
      // 關鍵字固定用中文「停車場」，因為這些點都在台灣，中文命中率最高。
      var park = "https://www.google.com/maps/search/?api=1&query=" +
                 encodeURIComponent("停車場 " + here);
      html += '<a href="' + esc(park) + '" target="_blank" rel="noopener">' + esc(l.parking) + '</a>';
    }
    return '<div class="maps">' + html + '</div>';
  }

  function renderStop(s, prev){
    var l = L(), rows = "";
    if (s.howTo)    rows += '<div class="crow"><span class="k">' + esc(l.rowHowTo) + '</span><span class="v">' + esc(s.howTo) + '</span></div>';
    if (s.detail)   rows += '<div class="crow"><span class="k">' + esc(l.rowDetail) + '</span><span class="v">' + esc(s.detail) + '</span></div>';
    if (s.hours)    rows += '<div class="crow"><span class="k">' + esc(l.rowHours) + '</span><span class="v">' + esc(s.hours) + '</span></div>';
    if (s.rainPlan) rows += '<div class="crow rain"><span class="k">' + esc(l.rowRain) + '</span><span class="v">' + esc(s.rainPlan) + '</span></div>';

    var notes = "";
    if (s.notes.length || s.booking){
      notes = '<div class="notes">' +
        s.notes.map(function(n){ return '<span class="note">' + esc(n) + '</span>'; }).join("") +
        (s.booking ? '<span class="note book">' + esc(s.booking) + '</span>' : '') + '</div>';
    }

    var cands = "";
    if (s.kind === "stay"){
      cands = bookingBlock(state.form, s);
    } else if (s.checking){
      cands = '<div class="checking"><span class="pulse"></span>' + esc(l.checking) + '</div>';
    } else if (s.candidates && s.candidates.length){
      cands = '<div class="cands"><div class="h">' + esc(l.candsFound) + '</div>' +
        s.candidates.map(function(c){
          return '<div class="cand"><span class="b">·</span><span><span class="n">' + esc(c.name) + '</span>' +
                 (c.note ? ' — ' + esc(c.note) : '') +
                 (c.url ? ' <a class="s" href="' + esc(c.url) + '" target="_blank" rel="noopener">' + esc(l.source) + '</a>' : '') +
                 '</span></div>';
        }).join("") + '</div>';
    } else if (s.candidates && s.candidates.length === 0){
      cands = '<div class="cands none"><div class="h">' + esc(l.candsNone(s.area)) + '</div></div>';
    }

    var cost = s.cost > 0
      ? '<span class="cost mono">' + money(s.cost) + '<small>' + esc(unit(s.costUnit)) + '</small></span>'
      : '<span class="cost mono free">' + esc(l.free) + '</span>';

    var meta = [];
    if (s.duration) meta.push(s.duration);
    if (s.area) meta.push(s.area);
    meta.push(l.kinds[s.kind]);

    var flag = "";
    if (s.kind !== "transit" && s.kind !== "stay"){
      if (s.verified === "generic") flag = '<span class="flag">' + esc(l.flagGeneric) + '</span>';
      else if (s.verified === "unverified") flag = '<span class="flag warn">' + esc(l.flagUnverified) + '</span>';
    }

    return '<div class="stop' + (s.off ? ' off' : '') + '" data-kind="' + s.kind + '">' +
        '<div class="rail"><span class="dot"></span></div>' +
        '<div class="card">' +
          '<div class="chead">' +
            (s.time ? '<span class="ctime mono">' + esc(s.time) + '</span>' : '') +
            '<span class="cname">' + esc(s.name) + '</span>' + cost +
          '</div>' +
          '<div class="tags" style="margin-top:6px">' +
            meta.map(function(m){ return '<span class="tag">' + esc(m) + '</span>'; }).join("") + flag +
          '</div>' +
          rows + notes +
          (s.kind === "transit" ? "" : mapLinks(s, prev)) + cands +
          '<div class="cfoot"><button type="button" class="mini" data-toggle="' + s.id + '">' +
            esc(s.off ? l.restoreStop : l.removeStop) + '</button></div>' +
        '</div></div>';
  }

  function renderExtra(x){
    var l = L();
    return '<div class="xcard">' +
        '<h3>' + esc(x.name) + '</h3>' +
        (x.area ? '<span class="tag" style="align-self:flex-start">' + esc(x.area) + '</span>' : '') +
        '<p>' + esc(x.why) + '</p>' +
        '<div class="xf">' +
          (x.cost > 0
            ? '<span class="cost mono">' + money(x.cost) + '<small>' + esc(unit(x.costUnit)) + '</small></span>'
            : '<span class="cost mono free">' + esc(l.free) + '</span>') +
          '<button type="button" class="mini" data-add="' + x.id + '">' +
            esc(x.added ? l.addedExtra : l.addExtra) + '</button>' +
        '</div></div>';
  }

  function pendingRow(){
    return '<div class="stop pending"><div class="rail"><span class="dot"></span></div>' +
           '<div class="card"><span class="pulse"></span>' + esc(t("pending")) + '</div></div>';
  }

  function insertSlot(i){
    var l = L();
    if (state.insertAt === i){
      var kinds = [["food",l.insertKindFood],["sight",l.insertKindSight],["other",l.insertKindOther]];
      return '<div class="ins"><div class="rail"></div><div class="insform">' +
        '<input type="text" id="insName" value="' + esc(state.insertName || "") + '" placeholder="' + esc(l.insertName) + '">' +
        '<div class="kinds">' + kinds.map(function(k){
          return '<button type="button" data-ik="' + k[0] + '"' +
                 (state.insertKind === k[0] ? ' class="on"' : '') + '>' + esc(k[1]) + '</button>';
        }).join("") + '</div>' +
        '<div class="go">' +
          '<button type="button" class="mini" data-inscancel="1">' + esc(l.insertCancel) + '</button>' +
          '<button type="button" class="mini act" data-insadd="' + i + '">' + esc(l.insertAdd) + '</button>' +
        '</div></div></div>';
    }
    return '<div class="ins"><div class="rail"></div>' +
           '<button type="button" class="insbtn" data-insat="' + i + '">＋ ' + esc(l.insertHere) + '</button></div>';
  }

  function renderTimeline(){
    var maxDay = 1;
    state.stops.forEach(function(s){ if (s.day > maxDay) maxDay = s.day; });
    var html = "", lastDay = 0;
    state.stops.forEach(function(s, i){
      if (maxDay > 1 && s.day !== lastDay){
        lastDay = s.day;
        var spend = dayCost(s.day);
        html += '<div class="dayline"><span class="daytag">' + esc(L().dayN(s.day)) + '</span>' +
                '<span class="rule"></span>' +
                (spend > 0 ? '<span class="sub">' + money(spend) + '</span>' : '') + '</div>';
      }
      html += renderStop(s, i > 0 ? state.stops[i-1] : null);
      if (!state.streaming) html += insertSlot(i + 1);
    });
    return html;
  }

  function toolbar(){
    var l = L();
    if (state.streaming) return "";
    return '<div class="toolbar">' +
      '<button type="button" class="mini' + (state.edited ? ' act' : '') + '" id="replanBtn"' +
        (state.replanning ? ' disabled' : '') + '>' +
        esc(state.replanning ? l.replanning : l.replanBtn) + '</button>' +
      '<button type="button" class="mini" id="saveBtn">' + esc(state.justSaved ? l.tripSaved : l.saveTrip) + '</button>' +
      '<button type="button" class="mini" id="printBtn">' + esc(l.downloadPdf) + '</button>' +
      '<button type="button" class="mini" id="exportBtn">' + esc(l.exportJson) + '</button>' +
      (state.form.date ? '<button type="button" class="mini" id="icsBtn">' + esc(l.downloadIcs) + '</button>' : '') +
      '</div>' +
      (state.edited ? '<p class="hint warn">' + esc(l.replanHint) + '</p>' : '') +
      (state.replanNote ? '<p class="hint">' + esc(state.replanNote) + '</p>' : '');
  }

  function render(){
    var l = L(), f = state.form;
    var tags = [
      f.from + " → " + f.to,
      f.date || l.tagNoDate,
      f.days > 1 ? l.tagDays(f.days) : l.tagRoundTrip,
      l.tagPeople(f.people)
    ].concat(f.transport, f.needs);

    var banner;
    if (state.mock){
      banner = '<div class="notice demo"><b>' + esc(l.noticeMockB) + '</b>　' + esc(l.noticeMock) + '</div>';
    } else if (state.demo){
      banner = '<div class="notice demo"><b>' + esc(l.noticeDemoB) + '</b>　' + esc(l.noticeDemo) + '</div>';
    } else {
      banner = '<div class="notice"><b>' + esc(l.noticeAIB) + '</b>　' + esc(l.noticeAI) + '</div>';
    }

    out.innerHTML = banner +
      '<div class="trip-head">' +
        '<h2>' + esc(state.title) + '</h2>' +
        (state.summary ? '<p>' + esc(state.summary) + '</p>' : '') +
        '<div class="tags">' + tags.map(function(x){ return '<span class="tag">' + esc(x) + '</span>'; }).join("") + '</div>' +
      '</div>' +
      '<div class="secttl">' + esc(l.secRoute) + '</div>' + toolbar() +
      '<div class="timeline">' + renderTimeline() + (state.streaming ? pendingRow() : "") + '</div>' +
      (state.extras.length
        ? '<div class="secttl">' + esc(l.secExtras) + '</div><div class="extras">' + state.extras.map(renderExtra).join("") + '</div>'
        : '') +
      (state.tips.length
        ? '<div class="secttl">' + esc(l.secTips) + '</div><ul class="tips">' +
          state.tips.map(function(x){ return '<li>' + esc(x) + '</li>'; }).join("") + '</ul>'
        : '');
    renderTotals();
  }

  function renderTotals(){
    var l = L(), tt = totals(), f = state.form;
    var order = ["transit","food","sight","stay","other"];
    document.getElementById("tbreak").innerHTML =
      order.filter(function(g){ return tt.groups[g]; }).map(function(g){
        return '<div class="tb"><span class="lab">' + esc(l.groups[g]) + '</span>' +
               '<span class="val mono">' + money(tt.groups[g]) + '</span></div>';
      }).join("") ||
      '<div class="tb"><span class="lab">' + esc(l.spendNow) + '</span><span class="val mono">' + esc(l.noSpend) + '</span></div>';

    document.getElementById("perHead").textContent = money(tt.perHead);
    document.getElementById("grand").textContent = money(tt.grand);

    var chip = document.getElementById("budgetChip");
    if (!f.budget){ chip.hidden = true; }
    else {
      chip.hidden = false;
      var diff = f.budget - tt.perHead;
      chip.classList.toggle("over", diff < 0);
      chip.textContent = diff >= 0 ? l.budgetLeft(money(diff)) : l.budgetOver(money(-diff));
    }
    totalsBar.hidden = false;
  }

  out.addEventListener("click", function(e){
    var tg = e.target.dataset.toggle, ad = e.target.dataset.add;
    if (tg){
      state.stops.forEach(function(s){ if (s.id === tg) s.off = !s.off; });
      state.edited = true;
      render();
    } else if (ad){
      var x = null;
      state.extras.forEach(function(v){ if (v.id === ad) x = v; });
      if (!x || x.added) return;
      x.added = true;
      var lastDay = 1;
      state.stops.forEach(function(s){ if (s.day > lastDay) lastDay = s.day; });
      state.stops.push({
        id: "s" + Date.now(), kind: x.kind, day: lastDay, name: x.name, time: "",
        duration: "", howTo: "", detail: x.why, hours: "", area: x.area,
        cost: x.cost, costUnit: x.costUnit, verified: "unverified",
        candidates: null, checking: false, rainPlan: "",
        notes: [L().addedNote], booking: "", off: false
      });
      state.edited = true;
      render();
    }
  });

  out.addEventListener("click", function(e){
    var d = e.target.dataset || {};

    if (d.insat !== undefined){
      state.insertAt = Number(d.insat);
      render();
      var el = document.getElementById("insName");
      if (el) el.focus();
      return;
    }
    if (d.inscancel){ state.insertAt = -1; state.insertName = ""; render(); return; }
    if (d.ik){
      // 先把已經打的字收起來，重繪後才不會被清掉
      var typed = document.getElementById("insName");
      if (typed) state.insertName = typed.value;
      state.insertKind = d.ik;
      render();
      var back = document.getElementById("insName");
      if (back){ back.focus(); back.setSelectionRange(back.value.length, back.value.length); }
      return;
    }

    if (d.insadd !== undefined){
      var name = ((document.getElementById("insName") || {}).value || state.insertName || "").trim();
      if (!name) return;
      var at = Number(d.insadd);
      var neighbour = state.stops[at - 1] || state.stops[at] || {day:1, area:""};
      state.stops.splice(at, 0, normStop({
        kind: state.insertKind,
        name: name,
        day: neighbour.day,
        area: neighbour.area,
        // 使用者手動加的，我們對它一無所知 —— 標成未查證，別假裝知道
        verified: "unverified",
        cost: 0, costUnit: "每人",
        notes: [L().addedNote]
      }, Date.now()));
      state.insertAt = -1;
      state.insertName = "";
      state.edited = true;
      render();
      return;
    }

    if (e.target.id === "printBtn"){
      // 瀏覽器的列印引擎是這裡最好的 PDF 產生器：中日文完美、版面我控制、
      // 檔案小、不用在 512MB 的免費機器上跑 Chromium
      state.replanNote = L().pdfHint;
      render();
      setTimeout(function(){ window.print(); }, 60);
      return;
    }
    if (e.target.id === "saveBtn"){
      var list = loadSaved();
      list.unshift(tripSnapshot());
      if (writeSaved(list)){
        state.justSaved = true;
        renderSaved();
        render();
        setTimeout(function(){ if (state) { state.justSaved = false; render(); } }, 2000);
      }
      return;
    }
    if (e.target.id === "exportBtn"){
      download(safeName() + ".json", JSON.stringify(tripSnapshot(), null, 2), "application/json");
      return;
    }
    if (e.target.id === "icsBtn"){
      var ics = buildIcs();
      if (ics) download(safeName() + ".ics", ics, "text/calendar;charset=utf-8");
      return;
    }

    if (e.target.id === "replanBtn"){ replan(); return; }
  });

  /**
   * 重排時間。只送站序回去，回來只套用時間類欄位 ——
   * 名稱、價格、備註都是使用者手上那份，模型不准動。
   */
  function replan(){
    if (!state || state.replanning) return;
    state.replanning = true;
    state.replanNote = "";
    render();

    var live = state.stops.filter(function(s){ return !s.off; });
    fetch("/api/replan", {
      method: "POST",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify({
        form: state.form,
        stops: live.map(function(s){
          return {kind:s.kind, name:s.name, time:s.time, duration:s.duration,
                  area:s.area, day:s.day, cost:s.cost, costUnit:s.costUnit};
        })
      })
    })
      .then(function(r){ return r.json(); })
      .then(function(j){
        if (!j.ok || !Array.isArray(j.patch) || j.patch.length !== live.length){
          state.replanNote = L().replanFail;
          return;
        }
        live.forEach(function(s, i){
          var pch = j.patch[i];
          s.time = pch.time || s.time;
          s.duration = pch.duration || s.duration;
          if (pch.howTo) s.howTo = pch.howTo;
          s.day = pch.day || s.day;
        });
        state.edited = false;
        state.replanNote = j.note || "";
      })
      .catch(function(){ state.replanNote = L().replanFail; })
      .then(function(){ state.replanning = false; render(); });
  }

  /* ==================== 存檔、匯出、匯入 ==================== */

  var STORE_KEY = "shunlu.trips";

  /**
   * 存在瀏覽器裡。不是雲端 —— 換一台裝置就看不到，這點在匯出按鈕旁邊講清楚。
   * 要跨裝置就用「匯出檔案」，那份 JSON 也是備份。
   */
  function loadSaved(){
    try {
      var raw = localStorage.getItem(STORE_KEY);
      var arr = raw ? JSON.parse(raw) : [];
      return Array.isArray(arr) ? arr : [];
    } catch (e){ return []; }
  }
  function writeSaved(list){
    try { localStorage.setItem(STORE_KEY, JSON.stringify(list.slice(0, 30))); return true; }
    catch (e){ return false; }   // 無痕模式或空間滿了
  }

  /** 存下來的是「可以還原的最小集合」，不含 candidates 那些查證結果 */
  function tripSnapshot(){
    return {
      v: 1,
      savedAt: Date.now(),
      title: state.title,
      summary: state.summary,
      tips: state.tips,
      form: state.form,
      stops: state.stops.map(function(s){
        return {kind:s.kind, day:s.day, name:s.name, time:s.time, duration:s.duration,
                howTo:s.howTo, detail:s.detail, hours:s.hours, area:s.area,
                cost:s.cost, costUnit:s.costUnit, verified:s.verified,
                rainPlan:s.rainPlan, notes:s.notes, booking:s.booking, off:s.off};
      }),
      extras: state.extras.map(function(x){
        return {kind:x.kind, name:x.name, why:x.why, area:x.area, cost:x.cost, costUnit:x.costUnit};
      })
    };
  }

  function restoreTrip(snap){
    if (!snap || !Array.isArray(snap.stops) || !snap.stops.length) return false;
    var f = Object.assign({}, readForm(), snap.form || {});
    var tr = normalize(snap, f, false);
    // off 狀態要跟著回來，不然使用者刪掉的站會全部復活
    snap.stops.forEach(function(raw, i){ if (raw && raw.off && tr.stops[i]) tr.stops[i].off = true; });
    state = tr;
    render();
    window.scrollTo({top:0, behavior:"smooth"});
    return true;
  }

  function renderSaved(){
    var l = L(), list = loadSaved(), host = document.getElementById("savedList");
    if (!list.length){
      host.innerHTML = '<div class="empty-saved">' + esc(l.noSavedTrips) + '</div>';
      return;
    }
    host.innerHTML = list.map(function(tr, i){
      var d = new Date(tr.savedAt || Date.now());
      var stamp = (d.getMonth()+1) + "/" + d.getDate();
      return '<div class="srow">' +
        '<span class="n" title="' + esc(tr.title) + '">' + esc(tr.title || "—") + '</span>' +
        '<span class="d">' + stamp + '</span>' +
        '<button type="button" data-open="' + i + '">' + esc(l.openTrip) + '</button>' +
        '<button type="button" class="del" data-del="' + i + '">' + esc(l.deleteTrip) + '</button>' +
        '</div>';
    }).join("");
  }

  function download(filename, text, mime){
    var blob = new Blob([text], {type: mime});
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click();
    document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
  }

  function safeName(){
    return (state.title || "trip").replace(/[\\/:*?"<>|]/g, "").slice(0, 60).trim() || "trip";

  /**
   * .ics 行事曆。每一站一個事件，時間用行程裡的 time 加上出發日推算。
   * 沒有時間的站跳過 —— 硬塞一個假時間到行事曆裡比不加更糟。
   */
  function buildIcs(){
    var f = state.form;
    if (!f.date) return null;
    function stamp(dayOffset, hhmm){
      var d = new Date(f.date + "T00:00:00");
      if (isNaN(d.getTime())) return null;
      d.setDate(d.getDate() + dayOffset);
      var m = /^(\d{1,2}):(\d{2})/.exec(hhmm || "");
      if (!m) return null;
      d.setHours(Number(m[1]), Number(m[2]), 0, 0);
      return d.getFullYear() + pad2(d.getMonth()+1) + pad2(d.getDate()) +
             "T" + pad2(d.getHours()) + pad2(d.getMinutes()) + "00";
    }
    function fold(line){
      // RFC 5545 規定一行最多 75 個八位元組，超過要折行
      var outLines = [], buf = line;
      while (buf.length > 72){ outLines.push(buf.slice(0,72)); buf = " " + buf.slice(72); }
      outLines.push(buf);
      return outLines.join("\r\n");
    }
    function escIcs(x){
      return String(x||"").replace(/\\/g,"\\\\").replace(/;/g,"\\;").replace(/,/g,"\\,").replace(/\n/g,"\\n");
    }
    var rows = ["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//shunlu//trip//TW","CALSCALE:GREGORIAN"];
    var n = 0;
    state.stops.forEach(function(s, i){
      if (s.off) return;
      var start = stamp(s.day - 1, s.time);
      if (!start) return;
      n++;
      var desc = [s.howTo, s.detail, s.hours, s.rainPlan].filter(Boolean).join("\n");
      rows.push("BEGIN:VEVENT");
      rows.push("UID:shunlu-" + i + "-" + Date.now() + "@shunlu");
      rows.push("DTSTART:" + start);
      rows.push(fold("SUMMARY:" + escIcs(s.name)));
      if (s.area) rows.push(fold("LOCATION:" + escIcs([s.name, s.area, f.to].filter(Boolean).join(" "))));
      if (desc) rows.push(fold("DESCRIPTION:" + escIcs(desc)));
      rows.push("END:VEVENT");
    });
    rows.push("END:VCALENDAR");
    return n ? rows.join("\r\n") : null;
  }

  /* ==================== 送出與串流 ==================== */

  function streamPlan(f, signal, handlers){
    return fetch("/api/plan/stream", {
      method: "POST",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify(f),
      signal: signal
    }).then(function(r){
      if (!r.ok || !r.body){
        return r.json().then(
          function(j){ throw {code: j.code, message: j.message}; },
          function(){ throw {code: "upstream_error"}; }
        );
      }
      var reader = r.body.getReader(), decoder = new TextDecoder(), buf = "";

      function flush(){
        var frames = buf.split("\n\n");
        buf = frames.pop();
        frames.forEach(function(frame){
          var ev = "message", data = "";
          frame.split("\n").forEach(function(line){
            if (line.indexOf("event:") === 0) ev = line.slice(6).trim();
            else if (line.indexOf("data:") === 0) data += line.slice(5).trim();
          });
          if (!data) return;
          var payload;
          try { payload = JSON.parse(data); } catch (err) { return; }
          if (handlers[ev]) handlers[ev](payload);
        });
      }
      function pump(){
        return reader.read().then(function(res){
          if (res.done){ flush(); return; }
          buf += decoder.decode(res.value, {stream:true});
          flush();
          return pump();
        });
      }
      return pump();
    });
  }

  form.addEventListener("submit", function(e){
    e.preventDefault();
    var f = readForm();
    ctl = new AbortController();
    goBtn.disabled = true;
    stopBtn.hidden = false;
    showLoading();

    var live = null, errored = false;

    function begin(meta){
      live = emptyTrip(f, false);
      live.streaming = true;
      live.title = (meta && meta.title) || (f.to + " · " + f.food);
      live.summary = (meta && meta.summary) || "";
      state = live;
      render();
    }

    streamPlan(f, ctl.signal, {
      meta: function(m){ begin(m); },
      stop: function(x){
        if (!live) begin(null);
        live.stops.push(normStop(x, live.stops.length));
        render();
      },
      extra: function(x){
        if (!live) begin(null);
        live.extras.push(normExtra(x, live.extras.length));
        render();
      },
      done: function(d){
        if (!live) return showError("empty_plan");
        live.streaming = false;
        live.mock = !!(d && d.mock);
        live.demo = live.mock;
        live.tips = (d && d.tips) || [];
        if (d && d.verifying > 0){
          live.stops.forEach(function(x){
            if (x.kind !== "transit" && x.kind !== "stay" && x.verified !== "landmark") x.checking = true;
          });
        }
        render();
      },
      verify: function(v){
        if (!live) return;
        var target = live.stops[v.index];
        if (!target) return;
        target.checking = false;
        target.candidates = v.candidates || [];
        render();
      },
      end: function(){
        if (!live) return;
        live.stops.forEach(function(x){ x.checking = false; });
        render();
      },
      error: function(err){
        errored = true;
        showError(err && err.code, err && err.message);
      }
    })
      .catch(function(err){
        if (errored) return;
        if (err && err.name === "AbortError") return showError("cancelled");
        showError((err && err.code) || "network", err && err.message);
      })
      .then(function(){
        clearInterval(timer);
        goBtn.disabled = false;
        stopBtn.hidden = true;
      });
  });
